version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: septa_ops_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-septa_ops}
      POSTGRES_USER: ${POSTGRES_USER:-septa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-septa_secure_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-septa_admin} -d ${POSTGRES_DB:-septa_ops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
