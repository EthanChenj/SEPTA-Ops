[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "septa-ops"
version = "0.1.0"
description = "Transit data engineering, predictive modeling, and multi-hop AI intelligence platform for SEPTA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SEPTA-Ops Engineering Team" }
]
dependencies = [
    # Data & Validation
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pandera[pandas]>=0.18.0",
    
    # Database & Vector Store
    "psycopg[binary]>=3.1.18",
    "sqlalchemy>=2.0.25",
    "pgvector>=0.2.5",
    
    # Text-to-SQL & Agent Framework
    "sqlglot>=20.0.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.5.0",
    
    # Modeling & Forecasting
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    
    # RAG & Documents
    "pypdf>=4.0.0",
    "pymupdf>=1.23.0",
    "tiktoken>=0.6.0",
    
    # Visualization & UI
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    
    # Utilities & Config
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*", "models*", "agent*", "app*", "evals*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["etl", "models", "agent", "app", "evals"]
